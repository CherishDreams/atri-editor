<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atri Editor Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .editor-wrapper {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        margin-bottom: 20px;
      }
      #editor {
        min-height: 400px;
      }
      .nodeview-demo,
      .media-demo {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        padding: 20px;
        margin-bottom: 20px;
      }
      .nodeview-demo h2,
      .media-demo h2 {
        margin-top: 0;
        color: #333;
      }
      .custom-card {
        border: 2px solid #1890ff;
        border-radius: 8px;
        padding: 16px;
        margin: 10px 0;
        background: #f0f7ff;
      }
      .custom-card h3 {
        margin: 0 0 8px 0;
        color: #1890ff;
      }
      .custom-card p {
        margin: 0;
        color: #666;
      }
      .custom-video {
        border: 2px solid #52c41a;
        border-radius: 8px;
        padding: 16px;
        margin: 10px 0;
        background: #f6ffed;
      }
      .custom-video h3 {
        margin: 0 0 8px 0;
        color: #52c41a;
      }
      .custom-video video {
        width: 100%;
        max-height: 200px;
        border-radius: 4px;
      }
      .controls {
        margin-top: 20px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        padding: 8px 16px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        background: white;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      button:hover {
        border-color: #1890ff;
        color: #1890ff;
      }
      .output {
        margin-top: 20px;
        padding: 15px;
        background: #f9f9f9;
        border-radius: 4px;
        border: 1px solid #e8e8e8;
      }
      .output h3 {
        margin-top: 0;
        color: #666;
      }
      pre {
        background: #282c34;
        color: #abb2bf;
        padding: 15px;
        border-radius: 4px;
        overflow-x: auto;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Atri Editor Demo</h1>

      <div class="editor-wrapper">
        <div id="editor"></div>
      </div>

      <div class="nodeview-demo">
        <h2>NodeView 自定义组件演示</h2>
        <p>点击下方按钮在编辑器中插入自定义组件：</p>
        <div class="controls" style="margin-top: 10px">
          <button id="btn-insertCard">插入卡片组件</button>
          <button id="btn-insertVideo">插入视频组件</button>
          <button id="btn-showNodeViews">查看已注册 NodeView</button>
        </div>
      </div>

      <div class="media-demo">
        <h2>图片与附件演示</h2>
        <p>
          工具栏的「图片」「附件」按钮打开插入浮层；也可以把文件直接拖进编辑区，或从截图工具粘贴。
          上传通道下方已打桩，进度、失败与重试都能当场看到。
        </p>
        <div class="controls" style="margin-top: 10px">
          <label
            ><input type="checkbox" id="chk-fail" /> 让下一次上传失败（验状态条的「重试」）</label
          >
        </div>
        <div class="controls" style="margin-top: 10px">
          <button id="btn-insertImage">插入远程图片</button>
          <button id="btn-insertAttachment">插入附件卡片</button>
          <button id="btn-checkUploads">检查未落地的上传</button>
        </div>
      </div>

      <div class="controls">
        <button id="btn-getHTML">获取 HTML</button>
        <button id="btn-getMarkdown">获取 Markdown</button>
        <button id="btn-getJSON">获取 JSON</button>
        <button id="btn-setContent">设置内容</button>
        <button id="btn-clearContent">清空内容</button>
        <button id="btn-toggleTheme">切换主题</button>
      </div>

      <div class="output" id="output" style="display: none">
        <h3>输出:</h3>
        <pre id="output-content"></pre>
      </div>
    </div>

    <script type="module">
      import { AtriEditor } from '@atri-editor/core';
      import '@atri-editor/core/styles';

      // 全局错误捕获
      window.addEventListener('error', (e) => {
        console.error('[Atri Editor] Global error:', e.error || e.message);
      });

      window.addEventListener('unhandledrejection', (e) => {
        console.error('[Atri Editor] Unhandled rejection:', e.reason);
      });

      // NodeView 自定义组件配置
      const nodeViews = [
        {
          name: 'customCard',
          inline: false,
          atom: true,
          group: 'block',
          description: '自定义卡片组件',
          attributes: {
            title: { default: '卡片标题' },
            content: { default: '卡片内容' },
          },
          parseHTML: () => [
            {
              tag: 'custom-card',
              getAttrs: (el) => ({
                title: el.getAttribute('title') || '卡片标题',
                content: el.getAttribute('content') || '卡片内容',
              }),
            },
          ],
          renderHTML: ({ HTMLAttributes }) => {
            return ['custom-card', HTMLAttributes];
          },
          nodeView: (props) => {
            const dom = document.createElement('div');
            dom.className = 'custom-card';
            // 属性值来自文档数据（可能由粘贴或外部内容解析而来），不能拼进 innerHTML
            const title = document.createElement('h3');
            title.textContent = props.node.attrs.title;
            const body = document.createElement('p');
            body.textContent = props.node.attrs.content;
            dom.append(title, body);
            return { dom };
          },
          markdownSerialize: (node) => {
            return `> **${node.attrs.title}**\n> ${node.attrs.content}\n`;
          },
        },
        {
          name: 'customVideo',
          inline: false,
          atom: true,
          group: 'block',
          description: '自定义视频组件',
          attributes: {
            src: { default: '' },
            title: { default: '视频标题' },
          },
          parseHTML: () => [
            {
              tag: 'custom-video',
              getAttrs: (el) => ({
                src: el.getAttribute('src') || '',
                title: el.getAttribute('title') || '视频标题',
              }),
            },
          ],
          renderHTML: ({ HTMLAttributes }) => {
            return ['custom-video', HTMLAttributes];
          },
          nodeView: (props) => {
            const dom = document.createElement('div');
            dom.className = 'custom-video';
            const title = document.createElement('h3');
            title.textContent = props.node.attrs.title;
            const video = document.createElement('video');
            video.controls = true;
            video.src = props.node.attrs.src;
            dom.append(title, video);
            return { dom };
          },
          markdownSerialize: (node) => {
            return `**视频**: ${node.attrs.title}\n${node.attrs.src}\n`;
          },
        },
      ];

      // 打桩的上传通道：假装有网速，进度、失败、取消都能当场演一遍
      function simulateUpload(file, { onProgress, signal }) {
        return new Promise((resolve, reject) => {
          const willFail = document.getElementById('chk-fail').checked;
          let percent = 0;

          const settle = () => {
            if (willFail) {
              reject(new Error('模拟上传失败'));
              return;
            }
            // 回一个服务端地址：本地预览地址会被它换掉，卡片上的进度条同时消失
            const isImage = file.type.indexOf('image/') === 0;
            const url = isImage
              ? `https://picsum.photos/seed/${encodeURIComponent(file.name)}/480/270`
              : `https://cdn.example.com/uploads/${encodeURIComponent(file.name)}`;
            resolve({ url, name: file.name });
          };

          const timer = setInterval(() => {
            percent = Math.min(100, percent + 10);
            onProgress({
              percent,
              loaded: Math.round((file.size * percent) / 100),
              total: file.size,
            });
            if (percent >= 100) {
              clearInterval(timer);
              settle();
            }
          }, 120);

          // 编辑器销毁或节点被删掉时请求要跟着停
          signal.addEventListener('abort', () => {
            clearInterval(timer);
            reject(new DOMException('Aborted', 'AbortError'));
          });
        });
      }

      // 创建编辑器实例
      try {
        window.editor = new AtriEditor({
          element: '#editor',
          placeholder: '开始输入内容...',
          theme: 'light',
          content:
            '<h2>欢迎使用 Atri Editor</h2><p>这是一个基于 <strong>Tiptap v3</strong> 的富文本编辑器。</p><ul><li>支持 Markdown 语法</li><li>支持 AI 集成</li><li>框架无关设计</li></ul>',
          nodeViews: nodeViews,
          media: {
            upload: simulateUpload,
            // 上限故意压到 512KB，拖一张截图进去就能看到被拒绝的回调
            maxFileSize: 512 * 1024,
            maxFiles: 5,
            image: {
              resize: true,
              allowBase64: false,
              // 勾上「模拟上传失败」再传图：图会内联进文档保住，红框与「重试」还在
              fallbackToBase64: true,
              accept: 'image/*',
            },
            attachment: {
              accept: ['.pdf', '.zip', '.txt', '.md'],
            },
            onError: ({ file, reason, cause }) => {
              showOutput(
                `文件 ${file.name} 被拒绝：${reason}${cause ? `（${String(cause)}）` : ''}`
              );
            },
          },
          markdown: {
            enabled: true,
          },
          ai: {
            functions: [
              {
                id: 'continue',
                name: 'AI 续写',
                description: '根据上下文继续扩展内容',
                scope: 'cursor',
                outputMode: 'insert',
              },
              {
                id: 'translate',
                name: '翻译为英文',
                description: '将选中内容翻译为英文',
                scope: 'selection',
                outputMode: 'replace',
                prompt: '请将以下内容翻译为英文：{selection}',
              },
            ],
            requestEndpoint: async (context) => {
              // 模拟 AI 响应
              console.log('AI Request:', context);
              await new Promise((resolve) => setTimeout(resolve, 500));
              return {
                content: `**[AI 响应]** 这是模拟的 AI 输出内容。功能ID: ${context.functionId}`,
                contentType: 'markdown',
              };
            },
            autoTranslateMarkdownToHTML: true,
          },
          onCreate: (editor) => {
            console.log('[Atri Editor] Editor created successfully!', editor);
            const tiptapEditor = editor.editor;
            console.log('[Atri Editor] Schema nodes:', Object.keys(tiptapEditor.schema.nodes));
            console.log('[Atri Editor] Schema marks:', Object.keys(tiptapEditor.schema.marks));
          },
          onChange: (editor) => {
            console.log('Content changed');
          },
        });
      } catch (err) {
        console.error('[Atri Editor] Failed to create editor:', err);
      }

      // showOutput 辅助函数
      function showOutput(content) {
        const output = document.getElementById('output');
        const outputContent = document.getElementById('output-content');
        output.style.display = 'block';
        outputContent.textContent = content;
      }

      // 绑定按钮事件
      document.getElementById('btn-getHTML').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            showOutput('Error: Editor not initialized');
            return;
          }
          console.log('[Atri Editor] Calling getHTML()...');
          const html = window.editor.getHTML();
          console.log('[Atri Editor] getHTML() returned:', html.substring(0, 200));
          showOutput(html);
        } catch (err) {
          console.error('[Atri Editor] getHTML failed:', err);
          console.error('[Atri Editor] Error stack:', err.stack);
          showOutput('Error: ' + (err.message || String(err)));
        }
      });

      document.getElementById('btn-getMarkdown').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            showOutput('Error: Editor not initialized');
            return;
          }
          const md = window.editor.getMarkdown();
          showOutput(md);
        } catch (err) {
          console.error('[Atri Editor] getMarkdown failed:', err);
          showOutput('Error: ' + (err.message || String(err)));
        }
      });

      document.getElementById('btn-getJSON').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            showOutput('Error: Editor not initialized');
            return;
          }
          const json = window.editor.getJSON();
          showOutput(JSON.stringify(json, null, 2));
        } catch (err) {
          console.error('[Atri Editor] getJSON failed:', err);
          showOutput('Error: ' + (err.message || String(err)));
        }
      });

      document.getElementById('btn-setContent').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            return;
          }
          window.editor.setContent(
            '<p>这是新设置的内容！</p><p>支持 <strong>富文本</strong> 和 <em>格式化</em>。</p>'
          );
        } catch (err) {
          console.error('[Atri Editor] setContent failed:', err);
        }
      });

      document.getElementById('btn-clearContent').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            return;
          }
          window.editor.clearContent();
        } catch (err) {
          console.error('[Atri Editor] clearContent failed:', err);
        }
      });

      document.getElementById('btn-toggleTheme').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            return;
          }
          window.editor.toggleTheme();
        } catch (err) {
          console.error('[Atri Editor] toggleTheme failed:', err);
        }
      });

      // NodeView 按钮事件
      document.getElementById('btn-insertCard').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            return;
          }
          const tiptapEditor = window.editor.editor;
          tiptapEditor
            .chain()
            .focus()
            .insertContent({
              type: 'customCard',
              attrs: {
                title: '示例卡片',
                content: '这是一个自定义卡片组件的示例内容。',
              },
            })
            .run();
          console.log('[Atri Editor] Inserted customCard');
        } catch (err) {
          console.error('[Atri Editor] insertCard failed:', err);
        }
      });

      document.getElementById('btn-insertVideo').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            return;
          }
          const tiptapEditor = window.editor.editor;
          tiptapEditor
            .chain()
            .focus()
            .insertContent({
              type: 'customVideo',
              attrs: {
                src: 'https://www.w3schools.com/html/mov_bbb.mp4',
                title: '示例视频',
              },
            })
            .run();
          console.log('[Atri Editor] Inserted customVideo');
        } catch (err) {
          console.error('[Atri Editor] insertVideo failed:', err);
        }
      });

      document.getElementById('btn-showNodeViews').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            showOutput('Error: Editor not initialized');
            return;
          }
          const nodeViews = window.editor.getNodeViews();
          const nodeViewList = Array.from(nodeViews.keys());
          showOutput('已注册的 NodeView:\n' + nodeViewList.join('\n'));
          console.log('[Atri Editor] NodeViews:', nodeViewList);
        } catch (err) {
          console.error('[Atri Editor] showNodeViews failed:', err);
        }
      });

      // 媒体按钮事件
      document.getElementById('btn-insertImage').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            return;
          }
          window.editor.insertImage({
            src: 'https://picsum.photos/seed/atri/480/270',
            alt: '示例图片',
            title: '一张远程图片',
          });
        } catch (err) {
          console.error('[Atri Editor] insertImage failed:', err);
        }
      });

      document.getElementById('btn-insertAttachment').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            return;
          }
          window.editor.insertAttachment({
            src: 'https://cdn.example.com/uploads/spec.pdf',
            name: '需求说明书.pdf',
            size: 2621440,
            mime: 'application/pdf',
          });
        } catch (err) {
          console.error('[Atri Editor] insertAttachment failed:', err);
        }
      });

      document.getElementById('btn-checkUploads').addEventListener('click', function () {
        try {
          if (!window.editor) {
            console.error('[Atri Editor] Editor instance not initialized');
            showOutput('Error: Editor not initialized');
            return;
          }
          const pending = window.editor.hasPendingUploads();
          showOutput(
            `未落地的上传: ${pending ? '有（此时保存会把本地预览地址写进内容）' : '无'}\n\n` +
              window.editor.getMarkdown()
          );
        } catch (err) {
          console.error('[Atri Editor] checkUploads failed:', err);
        }
      });

      // 初始化确认
      console.log('[Atri Editor] Module loaded, window.editor =', !!window.editor);
      if (window.editor) {
        console.log(
          '[Atri Editor] Available methods:',
          Object.getOwnPropertyNames(Object.getPrototypeOf(window.editor)).filter(
            (m) => !m.startsWith('_')
          )
        );
      }
    </script>
  </body>
</html>
