name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Version PR 需要 contents/PR 写权限；npm Trusted Publishing 需要 id-token
permissions:
  contents: write
  pull-requests: write
  id-token: write

# 发布不可半途取消：同一时间只跑一个 release job
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # bootstrap 期配 NPM_TOKEN secret 走 token；删除该 secret 后自动切 OIDC 可信发布
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets 需要完整历史来判断自上次 tag 以来的变更
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Auth (token bootstrap; empty = fall through to OIDC)
        if: env.NPM_TOKEN != ''
        # 只写环境变量占位符，token 值不落盘；npm publish 时展开
        run: echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$HOME/.npmrc"

      - name: Gate (same checks as CI before anything ships)
        run: |
          pnpm check
          pnpm test
          pnpm build

      - name: Version PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: cd packages/core && npm publish --provenance --access public
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
