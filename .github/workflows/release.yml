name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Version PR 需要 contents/PR 写权限；npm Trusted Publishing 需要 id-token
permissions:
  contents: write
  pull-requests: write
  id-token: write

# 发布不可半途取消：同一时间只跑一个 release job
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # bootstrap 期配 NPM_TOKEN secret 走 token；删除该 secret 后自动切 OIDC 可信发布
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets 需要完整历史来判断自上次 tag 以来的变更
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Auth (token bootstrap; empty = fall through to OIDC)
        # 用 shell 判空而非 if: env 表达式——secret 未配置时表达式行为不可靠。
        # 只写占位符，token 值不落盘，npm publish 时从环境展开
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$HOME/.npmrc"
          fi

      - name: Gate (same checks as CI before anything ships)
        # 顺序与 ci.yml 一致：demo 的 typecheck 消费 core 的 dist（workspace
        # exports 的 types 指向构建产物），必须先 build 才能 check
        run: |
          pnpm build
          pnpm check
          pnpm test

      - name: Version PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          # changesets/action 不经过 shell 执行命令，不能用 `cd x && ...`；
          # npm publish 接受目录参数但必须带 ./ 前缀——裸 `packages/core` 会被
          # 当成 GitHub `owner/repo` 简写去 git ls-remote。registry 显式钉死官方源：
          # Trusted Publishing / provenance 只认 registry.npmjs.org
          publish: npm publish ./packages/core --provenance --access public --registry https://registry.npmjs.org/
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
