name: Pages

# 只在会改变站点内容的路径上触发；README 之类的纯文档改动不需要重新部署
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'demos/vanilla/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 两个站点的 @atri-editor/code-highlight/theme 指向 dist 里的 theme.css，
      # 所以必须先构建包，不能只构建站点
      - name: Build packages
        run: pnpm build

      # 站点与 demo 的 vite 配置里 base 都是 './'，构建产物可以直接放在任意子路径下
      - name: Assemble site
        run: |
          mkdir -p _site/demo
          cp -r site/dist/. _site/
          cp -r demos/vanilla/dist/. _site/demo/

      - uses: actions/configure-pages@v5
        with:
          # 首次运行时仓库还没开 Pages，直接调 API 打开（Settings → Pages → Source 会被设为 GitHub Actions）
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
