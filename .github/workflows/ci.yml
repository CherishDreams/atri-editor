name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # demo 的 typecheck 消费 core 的 dist（workspace 类型指向构建产物），须先 build
      - name: Build
        run: pnpm build

      # 单独成一步：体积超预算时红叉直接落在"Size budget"上，不用去合并日志里找是谁
      - name: Size budget
        run: pnpm size

      - name: Typecheck, lint and format check
        run: pnpm check

      - name: Test
        run: pnpm test
